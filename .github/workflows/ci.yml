name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Privacy gate
        run: npm run check:privacy

      - name: Test
        run: npm test

      - name: CLI smoke test
        run: |
          MINIMAL_NO_UPDATE_CHECK=1 node bin/minimal-ai.mjs --help
          MINIMAL_NO_UPDATE_CHECK=1 node bin/minimal-ai.mjs --version
          MINIMAL_NO_UPDATE_CHECK=1 MINIMAL_DIR="$(mktemp -d)" node bin/minimal-ai.mjs status

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Trusted publishing needs npm CLI >= 11.5.1 (Node 22 ships npm 10).
      - run: npm install -g npm@latest
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Verify changelog entry exists
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if ! grep -q "## \[${VERSION}\]" CHANGELOG.md; then
            echo "No CHANGELOG.md entry for version ${VERSION}"
            exit 1
          fi

      - name: Privacy gate
        run: npm run check:privacy

      - name: Publish
        # npm trusted publishing: OIDC via id-token (npm CLI >= 11.5.1),
        # no NODE_AUTH_TOKEN — tokens expire, OIDC doesn't.
        run: npm publish --access public --provenance